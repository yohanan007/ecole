version: "3.8"

# =============================================================================
# Production Configuration: Symfony + MySQL + PhpMyAdmin
# For development, use: docker-compose up (automatically uses override)
# For production, use: docker-compose -f docker-compose.yaml up
# =============================================================================

networks:
  app:
    driver: bridge

volumes:
  mysql_data:
    driver: local

services:
  # =========================================================================
  # MySQL Database
  # =========================================================================
  database:
    image: mysql:8.0
    container_name: ecole_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-ecole}
      MYSQL_USER: ${DATABASE_USER:-ecole}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-ecole}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    networks:
      - app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000
    labels:
      com.example.service: "database"

  # =========================================================================
  # PhpMyAdmin
  # =========================================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ecole_phpmyadmin
    restart: unless-stopped
    depends_on:
      - database
    environment:
      PMA_HOST: database
      PMA_USER: ${DATABASE_USER:-ecole}
      PMA_PASSWORD: ${DATABASE_PASSWORD:-ecole}
      PMA_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-root}
      PMA_ARBITRARY: 1
    ports:
      - "8080:80"
    networks:
      - app
    labels:
      com.example.service: "phpmyadmin"

  # =========================================================================
  # Symfony Application (Production Runtime)
  # =========================================================================
  app:
    build:
      context: ./
      dockerfile: ./php/Dockerfile
      target: runtime
    container_name: ecole_app
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET:-ChangeMe!SecureRandomString123}
      DATABASE_URL: ${DATABASE_URL:-mysql://${DATABASE_USER:-ecole}:${DATABASE_PASSWORD:-ecole}@database:3306/${DATABASE_NAME:-ecole}?serverVersion=8.0&charset=utf8mb4}
      MAILER_DSN: ${MAILER_DSN:-smtp://localhost:1025}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-sync://}
      DB_HOST: database
      DB_USER: ${DATABASE_USER:-ecole}
      DB_PASSWORD: ${DATABASE_PASSWORD:-ecole}
    volumes:
      - ./src:/app:cached
    ports:
      - "8000:8000"
    networks:
      - app
    labels:
      com.example.service: "app"
